<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.07" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#prodBg)" />
  
  <!-- Subtle Brand Watermark -->
  <text x="200" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#0F172A" opacity="0.03" text-anchor="middle">JSW STEEL</text>

  <!-- Product Illustration -->
  <g filter="url(#cardShadow)">
    
      <!-- JSW Steel Rebar Bundle with Ribs -->
      <g transform="translate(50, 40)">
        <defs>
          <linearGradient id="jswSteel" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="35%" stop-color="#94A3B8" />
            <stop offset="65%" stop-color="#E2E8F0" />
            <stop offset="100%" stop-color="#1E293B" />
          </linearGradient>
        </defs>
        <!-- Rebars in perspective -->
        <rect x="10" y="30" width="280" height="22" rx="11" fill="url(#jswSteel)" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="0" y="60" width="300" height="26" rx="13" fill="url(#jswSteel)" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="15" y="95" width="270" height="24" rx="12" fill="url(#jswSteel)" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="5" y="125" width="290" height="28" rx="14" fill="url(#jswSteel)" stroke="#0F172A" stroke-width="2"/>
        
        <!-- Distinctive Helical Ribs -->
        
          <line x1="30" y1="58" x2="42" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="35" y1="123" x2="48" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="52" y1="58" x2="64" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="57" y1="123" x2="70" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="74" y1="58" x2="86" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="79" y1="123" x2="92" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="96" y1="58" x2="108" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="101" y1="123" x2="114" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="118" y1="58" x2="130" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="123" y1="123" x2="136" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="140" y1="58" x2="152" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="145" y1="123" x2="158" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="162" y1="58" x2="174" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="167" y1="123" x2="180" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="184" y1="58" x2="196" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="189" y1="123" x2="202" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="206" y1="58" x2="218" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="211" y1="123" x2="224" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="228" y1="58" x2="240" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="233" y1="123" x2="246" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="250" y1="58" x2="262" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="255" y1="123" x2="268" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        
          <line x1="272" y1="58" x2="284" y2="88" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
          <line x1="277" y1="123" x2="290" y2="155" stroke="#0F172A" stroke-width="3.5" opacity="0.6"/>
        

        <!-- JSW Official Metal Mill Tag -->
        <g transform="translate(170, 75)">
          <rect width="110" height="50" rx="6" fill="#002B49" stroke="#E31837" stroke-width="2"/>
          <text x="55" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">JSW NEOSTEEL</text>
          <text x="55" y="36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E31837" text-anchor="middle">Fe 550D · 12mm</text>
          <circle cx="10" cy="25" r="4" fill="#F8FAFC"/>
        </g>
      </g>
    
  </g>

  <!-- Product Bottom Quality & Spec Bar -->
  <g transform="translate(16, 256)">
    <rect width="368" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="8" y="5" width="6" height="20" rx="3" fill="#002B49"/>
    <text x="22" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#002B49">JSW STEEL</text>
    <text x="358" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="end">100% Primary Virgin Steel · BIS 1786</text>
  </g>
</svg>