<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.07" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#prodBg)" />
  
  <!-- Subtle Brand Watermark -->
  <text x="200" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#0F172A" opacity="0.03" text-anchor="middle">JK SMARTBLOX</text>

  <!-- Product Illustration -->
  <g filter="url(#cardShadow)">
    
      <g transform="translate(60, 40)">
        <!-- 3D Concrete AAC Block -->
        <polygon points="50,90 200,50 260,80 110,120" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
        <polygon points="50,90 110,120 110,210 50,180" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
        <polygon points="110,120 260,80 260,170 110,210" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
        
        <!-- Micro-cellular Pores -->
        
          <circle cx="125" cy="135" r="1.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="134" cy="148" r="2.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="143" cy="161" r="3.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="152" cy="174" r="1.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="161" cy="187" r="2.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="170" cy="135" r="3.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="179" cy="148" r="1.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="188" cy="161" r="2.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="197" cy="174" r="3.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="206" cy="187" r="1.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="215" cy="135" r="2.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="224" cy="148" r="3.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="233" cy="161" r="1.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="132" cy="174" r="2.5" fill="#64748B" opacity="0.6"/>
        
          <circle cx="141" cy="187" r="3.5" fill="#64748B" opacity="0.6"/>
        

        <!-- JK Stamp -->
        <rect x="145" y="130" width="80" height="30" rx="4" fill="#047857" opacity="0.9"/>
        <text x="185" y="150" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">JK SMARTBLOX</text>
      </g>
    
  </g>

  <!-- Product Bottom Quality & Spec Bar -->
  <g transform="translate(16, 256)">
    <rect width="368" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="8" y="5" width="6" height="20" rx="3" fill="#047857"/>
    <text x="22" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#047857">JK SMARTBLOX</text>
    <text x="358" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="end">Precision Autoclaved Aerated Concrete Block</text>
  </g>
</svg>