<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.07" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#prodBg)" />
  
  <!-- Subtle Brand Watermark -->
  <text x="200" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#0F172A" opacity="0.03" text-anchor="middle">LIDCO</text>

  <!-- Product Illustration -->
  <g filter="url(#cardShadow)">
    
      <g transform="translate(50, 55)">
        <polygon points="10,60 270,30 290,70 30,100" fill="#E2E8F0" stroke="#334155" stroke-width="2.5"/>
        <polygon points="30,100 290,70 290,115 30,145" fill="#94A3B8" stroke="#334155" stroke-width="2.5"/>
        
        
          <line x1="50" y1="60" x2="60" y2="80" stroke="#1E293B" stroke-width="3"/>
        
          <line x1="78" y1="56.5" x2="88" y2="76.5" stroke="#1E293B" stroke-width="3"/>
        
          <line x1="106" y1="53" x2="116" y2="73" stroke="#1E293B" stroke-width="3"/>
        
          <line x1="134" y1="49.5" x2="144" y2="69.5" stroke="#1E293B" stroke-width="3"/>
        
          <line x1="162" y1="46" x2="172" y2="66" stroke="#1E293B" stroke-width="3"/>
        
          <line x1="190" y1="42.5" x2="200" y2="62.5" stroke="#1E293B" stroke-width="3"/>
        
          <line x1="218" y1="39" x2="228" y2="59" stroke="#1E293B" stroke-width="3"/>
        
          <line x1="246" y1="35.5" x2="256" y2="55.5" stroke="#1E293B" stroke-width="3"/>
        

        <g transform="translate(180, 80)">
          <rect width="60" height="20" rx="3" fill="#1E293B"/>
          <text x="30" y="14" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#FFF" text-anchor="middle">SS 304</text>
        </g>
      </g>
    
  </g>

  <!-- Product Bottom Quality & Spec Bar -->
  <g transform="translate(16, 256)">
    <rect width="368" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="8" y="5" width="6" height="20" rx="3" fill="#475569"/>
    <text x="22" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#475569">LIDCO</text>
    <text x="358" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="end">Anti-Odor Cockroach Trap (600mm)</text>
  </g>
</svg>