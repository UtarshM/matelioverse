<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.07" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#prodBg)" />
  
  <!-- Subtle Brand Watermark -->
  <text x="200" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#0F172A" opacity="0.03" text-anchor="middle">NXT BLOC</text>

  <!-- Product Illustration -->
  <g filter="url(#cardShadow)">
    
      <g transform="translate(60, 40)">
        <polygon points="50,85 200,45 265,75 115,115" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
        <polygon points="50,85 115,115 115,215 50,185" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
        <polygon points="115,115 265,75 265,175 115,215" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
        
        
          <circle cx="130" cy="130" r="1.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="141" cy="147" r="2.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="152" cy="164" r="3.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="163" cy="181" r="1.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="174" cy="198" r="2.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="185" cy="145" r="3.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="196" cy="162" r="1.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="207" cy="179" r="2.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="218" cy="196" r="3.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="229" cy="143" r="1.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="130" cy="160" r="2.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="141" cy="177" r="3.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="152" cy="194" r="1.5" fill="#475569" opacity="0.5"/>
        
          <circle cx="163" cy="141" r="2.5" fill="#475569" opacity="0.5"/>
        

        <rect x="150" y="135" width="85" height="32" rx="4" fill="#1E3A8A"/>
        <text x="192" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">NXT BLOC</text>
      </g>
    
  </g>

  <!-- Product Bottom Quality & Spec Bar -->
  <g transform="translate(16, 256)">
    <rect width="368" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="8" y="5" width="6" height="20" rx="3" fill="#1E3A8A"/>
    <text x="22" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#1E3A8A">NXT BLOC</text>
    <text x="358" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="end">Thermal Insulation Masonry Block</text>
